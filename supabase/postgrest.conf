# PostgREST config for local development
# Docs: https://postgrest.org/en/stable/references/configuration.html

db-uri = "postgres://authenticator:dev-password@127.0.0.1:5432/aura_volley_dev"
db-schemas = "public"
db-anon-role = "anon"

# JWT secret — must match the keys in .env.development.local
# This is the standard Supabase local dev secret (well-known, not a real secret)
jwt-secret = "super-secret-jwt-token-with-at-least-32-characters-long"

# Internal port — proxy on 54321 strips /rest/v1 and forwards here
server-port = 3001
